# ── MACSTACK CONFIGURATION ───────────────────────────────────────────────────
# Central config file for CLI logic, plugin defaults and paths

# SHARED LIB LOCATION (used in dev-phase)
SHARED_LIB="${MACROOT}/lib/shared.zsh"

# TODO [bootstrap]: Update to XDG path after install.sh
# SHARED_LIB="${XDG_CONFIG_HOME:-$HOME/.config}/macstack/lib/shared.zsh"

# EXPORT PLUGIN DEFAULTS
EXPORT_FORMAT="pdf"
EXPORT_LAYOUT="a4"
EXPORT_ORIENTATION="portrait"
EXPORT_MD_GEOMETRY="margin=1in"
EXPORT_FONT="CMU Serif"
EXPORT_COMPANY="private"
EXPORT_OUTPUT_DIR="$HOME/workspace/raw/inbox/export"
EXPORT_TEMP_DIR="$HOME/workspace/temp"
EXPORT_HTML_TOOL="weasyprint"
EXPORT_MD_TOOL="pandoc"

# SYSTEM / SYNC / LOGIC FLAGS
USE_CHEZMOI_PULL=false

# PLUGIN PATHS
OMZ_PLUGIN_ROOT="${ZSH_CUSTOM:-$HOME/workspace/tools/oh-my-zsh/custom}/plugins"
WORKSPACE_TOOLS_ROOT="$HOME/workspace/tools"
